name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.1.0)"
        required: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  BIN: db-mcp-server
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          # Both macOS targets build on the current arm64 image (x86_64 is cross-compiled);
          # pinned older images (macos-13/14) are retired and never get a runner.
          - { os: macos-latest,     target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: macos-latest,     target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    archive: zip }
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Require the tagged revision to be on main
        shell: bash
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked -p db-mcp-server --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NAME="${BIN}-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/${NAME}/"
          cp README.md LICENSE-MIT LICENSE-APACHE config/db-mcp.example.toml "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = $env:RELEASE_TAG
          $Name = "$env:BIN-$Tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$Name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" "dist/$Name/"
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE,config/db-mcp.example.toml "dist/$Name/"
          Compress-Archive -Path "dist/$Name/*" -DestinationPath "dist/$Name.zip"
          $Hash = (Get-FileHash "dist/$Name.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Name.zip" | Out-File -Encoding ascii "dist/$Name.zip.sha256"
      - name: Enable Rosetta for the macOS x64 smoke test
        if: matrix.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        shell: bash
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Verify archive and native first use (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NAME="${BIN}-${RELEASE_TAG}-${{ matrix.target }}"
          (cd dist && shasum -a 256 -c "${NAME}.tar.gz.sha256")
          VERIFY="$(mktemp -d)"
          tar -C "$VERIFY" -xzf "dist/${NAME}.tar.gz"
          cd "$VERIFY/$NAME"
          "./${BIN}" selftest
          "./${BIN}" verify-config --config db-mcp.example.toml
      - name: Verify archive and native first use (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Name = "$env:BIN-$env:RELEASE_TAG-${{ matrix.target }}"
          $Expected = (Get-Content "dist/$Name.zip.sha256").Split()[0]
          if ((Get-FileHash "dist/$Name.zip" -Algorithm SHA256).Hash -ne $Expected) {
            throw "SHA-256 mismatch for $Name.zip"
          }
          $Verify = Join-Path $env:RUNNER_TEMP $Name
          Expand-Archive -LiteralPath "dist/$Name.zip" -DestinationPath $Verify
          Push-Location $Verify
          & ".\$env:BIN.exe" selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\$env:BIN.exe" verify-config --config db-mcp.example.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
