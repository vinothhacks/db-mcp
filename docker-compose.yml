services:
  db-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db-mcp-server
    command:
      - db-mcp-server
      - serve
      - --transport
      - http
      - --bind
      - 0.0.0.0:8080
      - --config
      - /etc/db-mcp/db-mcp.toml
    ports:
      - "8080:8080"
    environment:
      DB_MCP_AUTH_TOKEN: ${DB_MCP_AUTH_TOKEN:-dev-agent-token}
      DB_MCP_ADMIN_TOKEN: ${DB_MCP_ADMIN_TOKEN:-dev-admin-token}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./config/db-mcp.example.toml:/etc/db-mcp/db-mcp.toml:ro
      - db-mcp-data:/var/lib/db-mcp/research
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: db-mcp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_prod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mysql:
    image: mysql:8.0
    container_name: db-mcp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: analytics
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  db-mcp-data:
