[[named_tools]]
name = "get_user_by_id"
description = "Retrieve a single user record by numeric user ID using bound parameters."
connection = "local-sqlite"
statement = "SELECT id, email, role, created_at FROM users WHERE id = ?1"
read_only = true
max_rows = 1
timeout_ms = 5000
allowed_roles = ["agent", "developer", "dba", "admin"]

[[named_tools.parameters]]
name = "user_id"
param_type = "integer"
description = "Unique numeric user identifier"
required = true

[[named_tools]]
name = "list_orders_by_status"
description = "List orders filtered by status with an optional minimum total in cents."
connection = "local-sqlite"
statement = "SELECT id, user_id, status, total_cents, created_at FROM orders WHERE status = ?1 AND total_cents >= ?2 ORDER BY id ASC"
read_only = true
max_rows = 100
timeout_ms = 5000
allowed_roles = ["agent", "developer", "dba", "admin"]

[[named_tools.parameters]]
name = "status"
param_type = "string"
description = "Order lifecycle status (e.g. completed, pending, cancelled)"
required = true

[[named_tools.parameters]]
name = "min_total_cents"
param_type = "integer"
description = "Minimum order total in cents"
required = false
default_value = 0
