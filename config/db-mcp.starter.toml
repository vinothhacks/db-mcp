# DB-MCP starter configuration
# Generated by `db-mcp init`. Validate with `db-mcp verify-config --config db-mcp.toml`.
#
# DSNs can be literal, `env:VARIABLE_NAME`, or `file:/path/to/secret`. They are never echoed
# in tool output, errors or audit logs.

server_name = "db-mcp"
server_version = "0.2.2"
default_mode = "ReadOnly"                 # Development | ReadOnly | GovernedProduction
active_profiles = ["Explore", "Query", "Diagnose", "Change", "Schema", "Ontology"]

[http]
bind = "127.0.0.1:8080"
auth_token = "env:DB_MCP_AUTH_TOKEN"      # Bearer token required on POST /mcp when the variable is set
admin_token = "env:DB_MCP_ADMIN_TOKEN"    # Bearer token required on POST /admin/approve

[audit]
in_memory = true
jsonl_path = ".db-mcp/audit.jsonl"
sqlite_path = ".db-mcp/audit.db"

[changes]
storage_path = ".db-mcp/changes.db"
policy_revision = "policy_v1"
default_ttl_seconds = 3600
# HMAC key signing approval records; required for apply_change on GovernedProduction connections.
# approval_key = "env:DB_MCP_APPROVAL_KEY"

# ---------------------------------------------------------------------------
# Local SQLite database (works out of the box; file is created if missing)
# ---------------------------------------------------------------------------
[ontology]
# Governed semantic layer. Dedicated metadata store (never business tables).
# Review/publish happens only out of band: `db-mcp ontology review|publish --config <this file>`
# or POST /admin/ontology/review|publish with the admin token.
storage_path = ".db-mcp/ontology.db"
tenant_id = "default"
# Optional HMAC key signing certifications (startup fails if set but unresolvable):
# review_key = "env:DB_MCP_ONTOLOGY_REVIEW_KEY"
certification_ttl_days = 180
max_discovery_objects = 2000
default_max_rows = 200
infer_joins = true

[[connections]]
id = "local-sqlite"
engine = "Sqlite"
dsn = "sqlite://.db-mcp/local.db"
mode = "Development"
read_only = false
description = "Local SQLite development database"
default_schema = "main"
timeout_ms = 10000
max_rows = 500
max_bytes = 1048576
allow_multi_statement = false
allow_explain_analyze = true
restricted_tables = []
sensitive_tables = []
sensitive_columns = ["password_hash", "api_key", "secret_token"]
deny_sensitive_column_access = false
unrestricted_sql_provenance = false
allowed_roles = ["*"]
allowed_principals = ["*"]
init_sql = """
CREATE TABLE IF NOT EXISTS notes (
    id INTEGER PRIMARY KEY,
    title TEXT NOT NULL,
    body TEXT,
    created_at TEXT NOT NULL DEFAULT (datetime('now'))
);
"""

# ---------------------------------------------------------------------------
# Optional external databases. Uncomment a block and set its environment variable
# (DATABASE_URL / MYSQL_URL). An `env:` reference whose variable is unset is a
# configuration error, so these stay commented until you need them.
# ---------------------------------------------------------------------------
# PostgreSQL (governed): writes only through propose_change -> approve -> apply_change
# ---------------------------------------------------------------------------
# [[connections]]
# id = "postgres"
# engine = "Postgres"
# dsn = "env:DATABASE_URL"                  # e.g. postgres://user:pass@localhost:5432/app
# mode = "GovernedProduction"
# read_only = false
# description = "Primary PostgreSQL database"
# default_schema = "public"
# timeout_ms = 10000
# max_rows = 500
# max_bytes = 1048576
# allow_multi_statement = false
# allow_explain_analyze = false
# has_pg_stat_statements = false            # set true when the extension is installed
# has_hypopg = false                        # set true when HypoPG is installed
# restricted_tables = []
# sensitive_tables = []
# sensitive_columns = ["password_hash", "api_key", "secret_token"]
# deny_sensitive_column_access = false
# unrestricted_sql_provenance = false
# allowed_roles = ["agent", "developer", "dba", "admin"]
# allowed_principals = ["*"]

# ---------------------------------------------------------------------------
# MySQL 8 (live server, read-only login: GRANT SELECT, SHOW VIEW ON analytics.*)
# Plain TCP; percent-encode special characters in the password. Check it with
#   db-mcp check-connection --config db-mcp.toml --connection mysql
# ---------------------------------------------------------------------------
# [[connections]]
# id = "mysql"
# engine = "MySql"
# backend = "live"                          # default for MySql; "simulated" = embedded demo engine
# dsn = "env:MYSQL_URL"                     # e.g. mysql://user:pass@localhost:3306/analytics
# mode = "ReadOnly"
# read_only = true
# description = "Read-only MySQL analytics replica"
# default_schema = "analytics"
# timeout_ms = 15000
# max_rows = 1000
# max_bytes = 1048576
# allow_multi_statement = false
# allow_explain_analyze = false
# restricted_tables = []
# sensitive_tables = []
# sensitive_columns = ["password_hash", "api_key", "secret_token"]
# deny_sensitive_column_access = false
# unrestricted_sql_provenance = false
# allowed_roles = ["*"]
# allowed_principals = ["*"]

# ---------------------------------------------------------------------------
# Declarative named tools: curated parameterized SQL the agent can call by name
# ---------------------------------------------------------------------------
[[named_tools]]
name = "recent_notes"
description = "List the most recent notes."
connection = "local-sqlite"
statement = "SELECT id, title, created_at FROM notes ORDER BY created_at DESC LIMIT ?1"
read_only = true
max_rows = 100
timeout_ms = 5000
allowed_roles = ["*"]

[[named_tools.parameters]]
name = "limit"
param_type = "integer"
description = "Maximum number of notes to return"
required = false
default_value = 20
