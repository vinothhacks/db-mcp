# DB-MCP Example Server Configuration (`ServerConfig`)
# Validate with:
#   db-mcp-server verify-config --config config/db-mcp.example.toml
#   npm run verify-config

server_name = "db-mcp"
server_version = "0.2.1"
default_mode = "ReadOnly"
active_profiles = ["Explore", "Query", "Diagnose", "Change", "Schema", "Ontology"]

[http]
bind = "127.0.0.1:8080"
auth_token = "env:DB_MCP_AUTH_TOKEN"
admin_token = "env:DB_MCP_ADMIN_TOKEN"

[audit]
in_memory = true
jsonl_path = "research/traces/audit.jsonl"
sqlite_path = "research/traces/audit.db"

[changes]
storage_path = "research/traces/changes.db"
policy_revision = "policy_v1"
default_ttl_seconds = 3600

[ontology]
# Governed semantic layer. Dedicated metadata store (never business tables).
# Review/publish happens only out of band: `db-mcp ontology review|publish --config <this file>`
# or POST /admin/ontology/review|publish with the admin token.
storage_path = "research/traces/ontology.db"
tenant_id = "default"
# Optional HMAC key signing certifications (startup fails if set but unresolvable):
# review_key = "env:DB_MCP_ONTOLOGY_REVIEW_KEY"
certification_ttl_days = 180
max_discovery_objects = 2000
default_max_rows = 200
infer_joins = true

[[connections]]
id = "local-sqlite"
engine = "Sqlite"
dsn = "sqlite://research/fixtures/sample.db"
mode = "Development"
read_only = false
description = "Local SQLite development fixture database"
default_schema = "main"
timeout_ms = 10000
max_rows = 500
max_bytes = 1048576
allow_multi_statement = false
allow_explain_analyze = true
restricted_tables = ["internal_secrets"]
sensitive_tables = []
sensitive_columns = ["password_hash", "api_key", "secret_token"]
deny_sensitive_column_access = false
unrestricted_sql_provenance = false
allowed_roles = ["*"]
allowed_principals = ["*"]
init_sql = """
DROP VIEW IF EXISTS active_user_orders;
DROP INDEX IF EXISTS idx_orders_e2e_stdio;
DROP TABLE IF EXISTS audit_logs;
DROP TABLE IF EXISTS order_items;
DROP TABLE IF EXISTS inventory;
DROP TABLE IF EXISTS orders;
DROP TABLE IF EXISTS users;
DROP TABLE IF EXISTS internal_secrets;
CREATE TABLE users (
    id INTEGER PRIMARY KEY,
    email TEXT NOT NULL,
    role TEXT NOT NULL,
    password_hash TEXT NOT NULL,
    created_at TEXT NOT NULL
);
CREATE TABLE orders (
    id INTEGER PRIMARY KEY,
    user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    status TEXT NOT NULL,
    total_cents INTEGER NOT NULL,
    created_at TEXT NOT NULL
);
CREATE TABLE inventory (
    sku TEXT PRIMARY KEY,
    available_qty INTEGER NOT NULL,
    reserved_qty INTEGER NOT NULL DEFAULT 0
);
CREATE TABLE order_items (
    id INTEGER PRIMARY KEY,
    order_id INTEGER NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
    sku TEXT NOT NULL REFERENCES inventory(sku),
    quantity INTEGER NOT NULL,
    unit_price_cents INTEGER NOT NULL
);
CREATE TABLE audit_logs (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    order_id INTEGER NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
    event_type TEXT NOT NULL,
    created_at TEXT NOT NULL
);
CREATE TABLE internal_secrets (
    id INTEGER PRIMARY KEY,
    secret_key TEXT NOT NULL,
    secret_value TEXT NOT NULL
);
CREATE VIEW active_user_orders AS
    SELECT o.id AS order_id, u.id AS user_id, u.email, o.status, o.total_cents, o.created_at
    FROM orders o
    JOIN users u ON o.user_id = u.id
    WHERE o.status = 'completed';
INSERT INTO users (id, email, role, password_hash, created_at) VALUES
    (1, 'alice@example.com', 'admin', 'hash_alice_secret', '2025-01-01T00:00:00Z'),
    (2, 'bob@example.com', 'customer', 'hash_bob_secret', '2025-01-02T00:00:00Z');
INSERT INTO orders (id, user_id, status, total_cents, created_at) VALUES
    (101, 1, 'completed', 4500, '2025-01-03T10:00:00Z'),
    (102, 2, 'pending', 1900, '2025-01-04T12:00:00Z');
INSERT INTO inventory (sku, available_qty, reserved_qty) VALUES
    ('SKU-PRO-1', 50, 1),
    ('SKU-STD-2', 100, 0);
INSERT INTO order_items (id, order_id, sku, quantity, unit_price_cents) VALUES
    (1001, 101, 'SKU-PRO-1', 1, 4500),
    (1002, 102, 'SKU-STD-2', 1, 1900);
INSERT INTO audit_logs (id, order_id, event_type, created_at) VALUES
    (1, 101, 'ORDER_CHECKED_OUT', '2025-01-03T10:01:00Z');
CREATE OR REPLACE PROCEDURE record_order_audit(order_id INTEGER, event_type TEXT)
BEGIN
    INSERT INTO audit_logs (order_id, event_type, created_at)
    SELECT o.id, event_type, o.created_at
    FROM orders o
    WHERE o.id = order_id;
END;
CREATE OR REPLACE PROCEDURE reserve_inventory(order_id INTEGER)
BEGIN
    UPDATE inventory
    SET reserved_qty = reserved_qty + 1
    WHERE sku IN (
        SELECT oi.sku
        FROM order_items oi
        WHERE oi.order_id = order_id
    );
    CALL record_order_audit(order_id, 'INVENTORY_RESERVED');
END;
CREATE OR REPLACE FUNCTION calculate_order_discount(order_id INTEGER)
RETURNS NUMERIC
BEGIN
    SELECT o.total_cents * 0.10
    FROM orders o
    JOIN users u ON u.id = o.user_id
    WHERE o.id = order_id;
END;
CREATE OR REPLACE PROCEDURE checkout_order(order_id INTEGER)
BEGIN
    PERFORM calculate_order_discount(order_id);
    UPDATE orders
    SET status = 'completed'
    WHERE id = order_id
      AND user_id IN (
          SELECT u.id
          FROM users u
          WHERE u.role = 'customer'
      );
    SELECT o.id, u.email
    FROM orders o
    JOIN users u ON u.id = o.user_id
    WHERE o.id = order_id;
    CALL reserve_inventory(order_id);
    CALL record_order_audit(order_id, 'ORDER_CHECKED_OUT');
END;
"""

