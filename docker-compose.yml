# PostgreSQL and MySQL connections in the example config are served by the embedded simulation
# (no wire client), so this compose file runs only db-mcp itself.
services:
  db-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db-mcp-server
    command:
      - db-mcp-server
      - serve
      - --transport
      - http
      - --bind
      - 0.0.0.0:8080
      - --config
      - /etc/db-mcp/db-mcp.toml
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_MCP_AUTH_TOKEN: ${DB_MCP_AUTH_TOKEN:?set DB_MCP_AUTH_TOKEN}
      DB_MCP_ADMIN_TOKEN: ${DB_MCP_ADMIN_TOKEN:?set DB_MCP_ADMIN_TOKEN}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./config/db-mcp.example.toml:/etc/db-mcp/db-mcp.toml:ro
      - db-mcp-data:/var/lib/db-mcp/research
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db-mcp-data:
